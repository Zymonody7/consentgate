services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - ISC_CPF_MERGE_FILE=/home/irisowner/dev/merge.cpf
      - CONSENTGATE_CONSOLE_DIR=/usr/irissys/csp/console/data
    ports:
      - "1972:1972"
      - "52773:52773"
    volumes:
      - ./:/home/irisowner/dev
    healthcheck:
      test: ["CMD", "iris", "session", "IRIS", "-U", "%SYS", "-B", "write 1"]
      interval: 20s
      timeout: 10s
      retries: 10
