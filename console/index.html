<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConsentGate — Disclosure queue</title>
<style>
:root{
  --ink:#16181D; --ink-2:#4C525C; --ink-3:#8B9098;
  --paper:#F5F4F0; --card:#FFFFFF; --line:#E4E2DB; --line-2:#D3D0C7;
  --side:#15181D; --side-ink:#EDEAE3; --side-ink-2:#9A9C99; --side-line:#2A2E36;
  --release:#1F6B45; --release-bg:#E8F2EC;
  --redact:#8A5A00;  --redact-bg:#FBF0D9;
  --deny:#A11D2B;    --deny-bg:#FAE8EA;
  --escalate:#2B4C7E;--escalate-bg:#E9EFF8;
  --amber:#8A5B12;   --amber-bg:#FBF0D9;
  --serif:Georgia,"Times New Roman",Times,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --r:10px; --r-sm:6px;
  --shadow:0 1px 2px rgba(22,24,29,.06),0 1px 3px rgba(22,24,29,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#EDEAE3; --ink-2:#B7B3AA; --ink-3:#817E77;
    --paper:#0F1114; --card:#171A1F; --line:#282C33; --line-2:#363B44;
    --side:#0A0C0F; --side-ink:#EDEAE3; --side-ink-2:#8E9095; --side-line:#22262D;
    --release:#8FD8B0; --release-bg:#15271E;
    --redact:#E8BE6C;  --redact-bg:#2A2314;
    --deny:#F2A5AA;    --deny-bg:#2E181B;
    --escalate:#A9C6EA;--escalate-bg:#172234;
    --amber:#E3AC63;   --amber-bg:#2A2314;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}

.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand svg{width:20px;height:20px;color:var(--side-ink)}
.brand small{display:block;font-weight:400;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-ink-2);margin-top:2px}
.nav{padding:8px 12px 0}
.nav-label{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--side-ink-2);padding:10px 8px 8px}
.nav button{display:flex;align-items:center;width:100%;gap:10px;padding:9px 10px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--side-ink-2);text-align:left;font-size:13px}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--side-ink)}
.nav button.on{background:rgba(255,255,255,.09);color:var(--side-ink);font-weight:600}
.nav .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;flex:none}
.nav .count{margin-left:auto;font-size:11.5px;color:var(--side-ink-2);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:16px 20px 20px;border-top:1px solid var(--side-line);display:grid;gap:6px;font-size:11.5px;color:var(--side-ink-2)}
.side-foot b{color:var(--side-ink);font-weight:500;font-variant-numeric:tabular-nums}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:16px;padding:18px 26px;border-bottom:1px solid var(--line);background:var(--card)}
.top h1{margin:0;font-family:var(--serif);font-size:20px;font-weight:400;letter-spacing:-.01em}
.top .spacer{flex:1}
.search{width:260px;height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--paper);color:var(--ink);font:inherit;font-size:13px}
.search:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:transparent}
.btn{height:34px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;background:transparent;color:var(--ink-2);font-size:13px}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:18px 26px 6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--serif);font-size:30px;line-height:1.1;letter-spacing:-.02em}
.kpi .l{margin-top:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kpi.warn{border-color:var(--amber)}
.kpi.warn .v{color:var(--amber)}

.body{display:grid;grid-template-columns:376px minmax(0,1fr);gap:22px;padding:16px 26px 26px;min-height:0;flex:1}

.list{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.card{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:3px solid transparent;border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow)}
.card:hover{border-color:var(--line-2)}
.card[aria-selected="true"]{border-left-color:var(--ink);border-color:var(--line-2)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card .r1{display:flex;align-items:baseline;gap:10px}
.card .mrn{font-family:var(--serif);font-size:17px;letter-spacing:-.01em}
.card .t{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.card .r2{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--ink-2);font-size:12.5px}
.card .org{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .r3{display:flex;align-items:center;gap:8px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tag svg{width:10px;height:10px}
.t-release{color:var(--release);background:var(--release-bg)}
.t-redact{color:var(--redact);background:var(--redact-bg)}
.t-deny{color:var(--deny);background:var(--deny-bg)}
.t-escalate{color:var(--escalate);background:var(--escalate-bg)}
.note{font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
.note.ovr{color:var(--escalate)}
.note.unt{color:var(--amber);font-weight:600}

.detail{overflow-y:auto;min-width:0;min-height:0}
.dwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.verdict{display:flex;align-items:flex-start;gap:18px;padding:24px 26px;border-bottom:1px solid var(--line)}
.verdict .vleft{flex:1;min-width:0}
.verdict .state{font-family:var(--serif);font-size:30px;line-height:1.1;letter-spacing:-.02em}
.verdict .line{margin-top:6px;color:var(--ink-2);font-size:13px;max-width:60ch}
.verdict .vright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.v-release .state{color:var(--release)} .v-redact .state{color:var(--redact)}
.v-deny .state{color:var(--deny)} .v-escalate .state{color:var(--escalate)}
.flagpill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.03em}
.flagpill.ovr{background:var(--escalate-bg);color:var(--escalate)}
.flagpill.unt{background:var(--amber-bg);color:var(--amber)}
.flagpill.gate{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);font-weight:500}

.dhead{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.dhead .mrn{font-family:var(--serif);font-size:22px;letter-spacing:-.01em}
.dhead .req{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.dhead .who{color:var(--ink-2);font-size:13px;max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.dsec{padding:20px 26px;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:0}
.dsec h4{margin:0 0 12px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--paper)}
.panel .ph{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:20px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip.rel{color:var(--release);border-color:currentColor;background:var(--release-bg)}
.chip.wh{color:var(--redact);border-color:currentColor;background:var(--redact-bg)}
.muted{color:var(--ink-3);font-size:12px}

.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0}
.meta dt{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.meta dd{margin:4px 0 0;font-family:var(--mono);font-size:12.5px}

.rationale{margin:0;font-size:14px;line-height:1.68;max-width:70ch}

.ev{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:12px;overflow:hidden}
.ev-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ev-h .doc{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.ev-h .cat{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.ev-h .cat::before{content:"·";margin:0 7px;color:var(--line-2)}
.ev-h .sp{flex:1}
.stamp{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid currentColor}
.stamp.ok{color:var(--release)}
.stamp.bad{color:var(--deny)}
.prov{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.quote{margin:0;padding:16px 18px;font-family:var(--serif);font-size:15px;line-height:28px;color:var(--ink);
  background:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(0,0,0,.035) 27px 28px);
  background-position:0 10px}
.quote::before{content:"\201C";font-size:26px;line-height:0;color:var(--line-2);margin-right:2px;vertical-align:-6px}

.readonly{margin-top:16px;padding:12px 14px;border:1px dashed var(--line-2);border-radius:var(--r-sm);color:var(--ink-3);font-size:12px}

.empty{padding:40px;text-align:center;color:var(--ink-3);font-size:13px}
.skel{height:12px;border-radius:3px;background:var(--line);margin:8px 0}
.back{display:none;margin-bottom:12px}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;padding:0 12px;gap:8px;height:56px}
  .brand{padding:0 10px 0 4px}.brand small{display:none}
  .nav{display:flex;padding:0;gap:4px}.nav-label{display:none}
  .nav button{width:auto}.nav .count{display:none}
  .side-foot{display:none}
  .kpis{grid-template-columns:1fr 1fr;padding:14px 16px 0}
  .body{grid-template-columns:1fr;padding:14px 16px 20px}
  .detail{display:none}
  body.open .list{display:none}
  body.open .detail{display:block}
  .back{display:inline-flex}
  .top{padding:12px 16px;gap:10px}.search{width:100%}.top h1{font-size:17px}
  .meta{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.6l6.4 2.6v5.2c0 4-2.7 7.3-6.4 8.6-3.7-1.3-6.4-4.6-6.4-8.6V4.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.9 10.1l2.1 2.1 4.2-4.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>ConsentGate<small>Disclosure review</small></span>
    </div>
    <nav class="nav">
      <div class="nav-label">Queue</div>
      <button class="on" data-f="all"><span class="dot"></span>All decisions<span class="count" id="cAll">0</span></button>
      <button data-f="escalate"><span class="dot"></span>Awaiting review<span class="count" id="cEsc">0</span></button>
      <button data-f="untrusted"><span class="dot"></span>Untrusted payloads<span class="count" id="cInj">0</span></button>
    </nav>
    <div class="side-foot">
      <div>Model <b id="fModel">—</b></div>
      <div>Snapshot <b id="fSnap">—</b></div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <h1>Disclosure queue</h1>
      <span class="spacer"></span>
      <input id="q" class="search" type="search" placeholder="Search MRN or request" aria-label="Search decisions">
      <button id="refresh" class="btn">Refresh</button>
    </header>
    <section class="kpis" id="kpis"></section>
    <div class="body">
      <ul class="list" id="rows" role="listbox" aria-label="Decisions"></ul>
      <section class="detail" id="detail" aria-live="polite"></section>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var rowsEl=$("rows"),detailEl=$("detail"),kpisEl=$("kpis");
  var state={all:[],items:[],sel:0,filter:"all",q:"",cat:""};

  var ICON={
    release:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2l2.6 2.6L10 3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    redact:'<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 1.7v8.6" stroke="currentColor" stroke-width="1.5"/></svg>',
    deny:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    escalate:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.4L9.8 9.2H2.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'
  };
  var WORD={RELEASE:"Release",REDACT:"Redact",DENY:"Deny",ESCALATE:"Escalate"};
  var CLS={RELEASE:"t-release",REDACT:"t-redact",DENY:"t-deny",ESCALATE:"t-escalate"};
  var VCLS={RELEASE:"v-release",REDACT:"v-redact",DENY:"v-deny",ESCALATE:"v-escalate"};

  function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function tag(k){return '<span class="tag '+(CLS[k]||"")+'">'+(ICON[k.toLowerCase()]||"")+(WORD[k]||esc(k))+"</span>";}
  function hhmm(iso){var m=String(iso||"").match(/(\d{2}:\d{2})/);return m?m[1]:"--";}
  function getJSON(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});}

  function kpis(s){
    if(!s){kpisEl.innerHTML="";return;}
    kpisEl.innerHTML=
      '<div class="kpi"><div class="v num">'+(s.total||0)+'</div><div class="l">Requests</div></div>'+
      '<div class="kpi"><div class="v num">'+((s.redacted||0)+(s.denied||0))+'</div><div class="l">Withheld</div></div>'+
      '<div class="kpi"><div class="v num">'+(s.pendingReview||0)+'</div><div class="l">Awaiting review</div></div>'+
      '<div class="kpi'+(s.injectionFlagged?" warn":"")+'"><div class="v num">'+(s.injectionFlagged||0)+'</div><div class="l">Untrusted payloads</div></div>';
    $("cAll").textContent=s.total||0;
    $("cEsc").textContent=s.pendingReview||0;
    $("cInj").textContent=s.injectionFlagged||0;
  }

  function applyFilter(){
    var q=state.q.trim().toLowerCase();
    state.items=state.all.filter(function(d){
      if(state.filter==="escalate"&&String(d.decision).toUpperCase()!=="ESCALATE")return false;
      if(state.filter==="untrusted"&&!d.injectionFlag)return false;
      if(q){
        var hay=(d.mrn+" "+d.requestId+" "+d.requestorOrg).toLowerCase();
        if(hay.indexOf(q)<0)return false;
      }
      return true;
    });
    if(state.sel>=state.items.length)state.sel=0;
    renderList();renderDetail();
  }

  function renderList(){
    if(!state.items.length){rowsEl.innerHTML='<li class="empty">No decisions match this view.</li>';return;}
    rowsEl.innerHTML=state.items.map(function(d,i){
      var k=String(d.decision||"").toUpperCase();
      var ovr=String(d.gateResult||"")==="OVERRIDDEN"?'<span class="note ovr">gate overridden</span>':"";
      var unt=d.injectionFlag?'<span class="note unt">untrusted</span>':"";
      return '<li><button class="card" data-i="'+i+'" aria-selected="'+(i===state.sel)+'">'+
        '<div class="r1"><span class="mrn">'+esc(d.mrn)+'</span><span class="t num">'+hhmm(d.createdAt)+'</span></div>'+
        '<div class="r2"><span class="org">'+esc(d.requestorOrg)+' · '+esc(d.purposeOfUse)+'</span></div>'+
        '<div class="r3">'+tag(k)+ovr+unt+'</div></button></li>';
    }).join("");
  }

  function chips(list,cls){
    if(!list||!list.length)return '<span class="muted">None</span>';
    return list.map(function(c){
      var v=String(c).toUpperCase();
      var on=state.cat&&state.cat===v;
      return '<button class="chip '+cls+(on?" sel":"")+'" data-cat="'+esc(v)+'">'+esc(c)+'</button>';
    }).join("");
  }

  function renderDetail(){
    var d=state.items[state.sel];
    if(!d){detailEl.innerHTML='<div class="dwrap"><div class="empty">Select a decision to review its evidence.</div></div>';return;}
    var k=String(d.decision||"").toUpperCase();
    var gate=String(d.gateResult||"");
    var rel=(d.released||[]).length,wh=(d.withheld||[]).length;
    var line=k==="RELEASE"?"Every requested category is permitted by the paperwork on file."
      :k==="REDACT"?rel+" of "+(rel+wh)+" categories permitted; "+wh+" withheld."
      :k==="DENY"?"No requested category is permitted."
      :"The evidence did not settle the question; routed for human review.";
    if(gate==="OVERRIDDEN"&&k!=="ESCALATE")line+=" The gate overrode the model's proposal.";

    var flags='<span class="flagpill gate">'+(gate==="OVERRIDDEN"?"Gate overridden":gate==="UNPARSEABLE"?"Output unparseable":"Gate passed")+"</span>";
    if(d.injectionFlag)flags+='<span class="flagpill unt">Untrusted payload</span>';

    var cat=state.cat;
    var evList=(d.evidence||[]).filter(function(e){return !cat||String(e.category).toUpperCase()===cat;});
    var ev=evList.map(function(e){
      var ok=(e.verified===1||e.verified===true);
      var prov=e.provenance?'<span class="prov">'+esc(e.provenance)+'</span>':"";
      return '<article class="ev"><div class="ev-h">'+
        '<span class="doc">Document '+esc(e.docId)+'</span>'+
        '<span class="cat">'+esc(e.category)+'</span>'+
        '<span class="cat">'+esc(e.effect)+'</span>'+prov+'<span class="sp"></span>'+
        (ok?'<span class="stamp ok">&#10003; Verified</span>':'<span class="stamp bad">&#10007; Not found</span>')+
        '</div><blockquote class="quote">'+esc(e.quote)+'</blockquote></article>';
    }).join("")||'<div class="muted">No evidence recorded for this view.</div>';

    detailEl.innerHTML='<div class="dwrap">'+
      '<div class="verdict '+VCLS[k]+'">'+
        '<div class="vleft"><div class="state">'+esc(WORD[k]||k)+'</div><div class="line">'+esc(line)+'</div></div>'+
        '<div class="vright">'+flags+'</div>'+
      '</div>'+
      '<div class="dhead"><span class="mrn">'+esc(d.mrn)+'</span><span class="who">'+esc(d.requestorOrg)+' · '+esc(d.purposeOfUse)+'</span><span class="req">'+esc(d.requestId)+' · '+esc(d.createdAt)+'</span></div>'+
      '<div class="dsec"><h4>Scope</h4><div class="scope">'+
        '<div class="panel"><div class="ph">Released ('+rel+')</div><div class="chips">'+chips(d.released,"rel")+'</div></div>'+
        '<div class="panel"><div class="ph">Withheld ('+wh+')</div><div class="chips">'+chips(d.withheld,"wh")+'</div></div>'+
      '</div></div>'+
      '<div class="dsec"><h4>Run</h4><dl class="meta">'+
        '<div><dt>Model</dt><dd>'+esc(d.model||"—")+'</dd></div>'+
        '<div><dt>Latency</dt><dd class="num">'+(d.latencyMs!=null?esc(d.latencyMs)+" ms":"—")+'</dd></div>'+
        '<div><dt>Confidence</dt><dd class="num">'+esc(d.confidence||"—")+'</dd></div>'+
        '<div><dt>Decision</dt><dd>'+esc(k)+'</dd></div>'+
      '</dl></div>'+
      '<div class="dsec"><h4>Rationale</h4><p class="rationale">'+esc(d.rationale||"No rationale recorded.")+'</p></div>'+
      '<div class="dsec"><h4>Evidence'+(cat?" · "+esc(cat)+" only":"")+'</h4>'+ev+
        '<div class="readonly">Read-only snapshot. Reviews are recorded through the authenticated API at /consentgate/api/review.</div>'+
      '</div>'+
    '</div>';

    Array.prototype.forEach.call(detailEl.querySelectorAll(".chip"),function(c){
      c.addEventListener("click",function(){
        var v=c.getAttribute("data-cat");
        state.cat=(state.cat===v)?"":v;
        renderDetail();
      });
    });
  }

  function select(i){
    if(i<0||i>=state.items.length)return;
    state.sel=i;state.cat="";
    Array.prototype.forEach.call(rowsEl.querySelectorAll(".card"),function(c){c.setAttribute("aria-selected",String(+c.dataset.i===i));});
    renderDetail();
    if(window.innerWidth<=980)document.body.classList.add("open");
  }

  rowsEl.addEventListener("click",function(e){var b=e.target.closest(".card");if(b)select(+b.dataset.i);});
  rowsEl.addEventListener("keydown",function(e){
    if(e.key==="ArrowDown"){e.preventDefault();select(Math.min(state.sel+1,state.items.length-1));}
    if(e.key==="ArrowUp"){e.preventDefault();select(Math.max(state.sel-1,0));}
  });
  Array.prototype.forEach.call(document.querySelectorAll(".nav button"),function(b){
    b.addEventListener("click",function(){
      Array.prototype.forEach.call(document.querySelectorAll(".nav button"),function(x){x.classList.remove("on");});
      b.classList.add("on");state.filter=b.getAttribute("data-f");applyFilter();
    });
  });
  $("q").addEventListener("input",function(e){state.q=e.target.value;applyFilter();});
  $("refresh").addEventListener("click",load);

  function load(){
    rowsEl.innerHTML='<li class="card"><div class="skel" style="width:60%"></div><div class="skel" style="width:40%"></div></li>'+
      '<li class="card"><div class="skel" style="width:70%"></div><div class="skel" style="width:35%"></div></li>';
    Promise.all([getJSON("data/decisions.json"),getJSON("data/stats.json").catch(function(){return null;})])
      .then(function(res){
        state.all=Array.isArray(res[0])?res[0]:[];
        kpis(res[1]);state.sel=0;state.cat="";
        if(state.all.length)$("fModel").textContent=state.all[0].model||"—";
        $("fSnap").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
        applyFilter();
      })
      .catch(function(err){
        rowsEl.innerHTML='<li class="empty">Decisions could not be loaded ('+esc(err.message)+").</li>";
      });
  }
  load();
})();
</script>
</body>
</html>
